<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تكتوكوبر — TokTokUber</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; background: #f1f5f9; color: #0f172a; padding: 18px; }
    .box { max-width: 520px; margin: 24px auto; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); text-align: center; }
    .hero { background: linear-gradient(135deg, #f59e0b, #d97706); color: #111827; padding: 18px; border-radius: 12px; margin-bottom: 16px; }
    .hero h1 { margin: 0; font-size: 24px; font-weight: 800; }
    .hero p { margin: 6px 0 0; font-size: 13px; font-weight: 600; }
    .link-btn { display: block; width: 100%; padding: 13px; margin-bottom: 10px; border-radius: 10px; text-decoration: none; font-weight: 800; font-size: 15px; }
    .btn-main { background: #111827; color: #fbbf24; }
    .btn-sec { background: #f59e0b; color: #111827; }
    .note { font-size: 12px; color: #64748b; margin-top: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <div class="hero">
      <h1>تكتوكوبر — TokTokUber</h1>
      <p>توصيل سريع ومباشر بالتوكتوك • تسعير مرن • حساب واضح</p>
    </div>
    <a class="link-btn btn-main" href="./rides.html">طلب توكتوك / استقبال مشاوير</a>
    <a class="link-btn btn-sec" href="./driver-admin.html">تسجيل سائق / حساب السائق / الإدارة</a>
    <div class="note">
      خدمة ربط بين الركاب وسائقي التوكتوك — يتم الاتفاق على الأجرة وتأكيد الرحلة داخل التطبيق، وتُدار النسب والمديونيات بوضوح.
    </div>
  </div>
</body>
</html>
